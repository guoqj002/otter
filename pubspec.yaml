name: fitstreak
description: "FitStreak - 健身习惯打卡，离线可用，无需注册。"
publish_to: 'none'
version: 2.4.4+16

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.6.2

  # 本地数据库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5

  # 偏好设置
  shared_preferences: ^2.3.3

  # 通知
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.2

  # 动效
  flutter_animate: ^4.5.2

  # 工具
  intl: ^0.20.1
  path: ^1.9.0
  uuid: ^4.5.1
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  local_auth: ^3.0.2
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/habit_icons/
